name: 3D benchmark
on:
  pull_request:
    paths:
      - 'apps/web/src/BoardScene3D.tsx'
      - 'e2e/benchmark3d.mjs'
      - '.github/workflows/benchmark3d.yml'
  workflow_dispatch:
    inputs:
      full:
        description: Run all 48 configurations instead of four quick cases
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Measure
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            pnpm benchmark:3d
          else
            pnpm benchmark:3d --quick
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark3d
          path: artifacts/benchmark3d/results.json
          if-no-files-found: error
